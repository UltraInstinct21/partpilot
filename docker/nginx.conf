# PartPilot frontend: nginx serves the Vite build and proxies the API.
#
# The browser calls only the PartPilot API. It never calls a distributor API
# and it never calls a language model (NFR-07). The keys stay in the backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The size of a PDF that the user opens in the source viewer.
    client_max_body_size 16m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # The API of the backend. The name "api" is the name of the compose service.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The files of the build. They have a hash in the name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The single page application. Every unknown path returns the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
