name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan the repository for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for secret like content
        run: |
          set -uo pipefail
          PATTERNS='sk-[A-Za-z0-9]{20,}|api[_-]?key[[:space:]]*[:=][[:space:]]*["'\'']?[A-Za-z0-9]{16,}|client[_-]?secret[[:space:]]*[:=][[:space:]]*["'\'']?[A-Za-z0-9]{16,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}'
          # The template of the environment file and the documentation hold the
          # names of the keys and example values. They are not secrets.
          HITS=$(grep -rInE "$PATTERNS" . \
            --exclude-dir=.git \
            --exclude-dir=docs \
            --exclude-dir=node_modules \
            --exclude-dir=.venv \
            --exclude-dir=dist \
            --exclude-dir=coverage \
            --exclude-dir=results \
            --exclude=.env.example || true)
          if [ -n "$HITS" ]; then
            echo "::error::Secret like content found in the repository."
            echo "$HITS"
            exit 1
          fi
          echo "No secret like content found."

      - name: Look for a tracked environment file
        run: |
          set -uo pipefail
          TRACKED=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::An environment file with the keys is in Git."
            echo "$TRACKED"
            exit 1
          fi
          echo "No environment file with the keys is in Git."

      - name: Look for a datasheet PDF in the repository
        run: |
          set -uo pipefail
          PDFS=$(git ls-files | grep -Ei '\.pdf$' || true)
          if [ -n "$PDFS" ]; then
            echo "::error::A PDF file is in the repository. The ethics note forbids it."
            echo "$PDFS"
            exit 1
          fi
          echo "No PDF file is in the repository."
