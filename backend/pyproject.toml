[project]
name = "partpilot-backend"
version = "0.1.0"
description = "PartPilot backend: collectors, tiered extraction, validation, services and API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
  # --- HTTP / auth / config -------------------------------------------------
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.12,<5",
  # google-genai (via langchain-google-genai) requires tenacity <9.2
  "tenacity>=9.0,<9.2",
  "authlib>=1.9,<2",
  "python-dotenv>=1.2,<2",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  # --- PDF -------------------------------------------------------------------
  "pdfplumber>=0.11,<0.12",
  "pymupdf>=1.24",
  # --- Data / units / matching ---------------------------------------------
  "pint>=0.26,<0.27",
  "rapidfuzz>=3.14,<4",
  "sqlalchemy>=2.1,<3",
  "alembic>=1.16,<2",
  "pandas>=2.2",
  "numpy>=2.0",
  "matplotlib>=3.9",
  # --- API ------------------------------------------------------------------
  "fastapi>=0.159,<0.160",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
  # --- LangChain ------------------------------------------------------------
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-community>=0.4,<0.5",
  "langchain-anthropic>=1.7,<2",
  "langchain-openai>=1.7,<2",
  "langchain-google-genai>=4.4,<5",
  "langchain-typesafe>=0.0.1a3",
  "duckduckgo-search>=8.1.1",
]

[project.optional-dependencies]
# Optional extras. Kept out of the default install so the core test suite stays
# fast and hermetic. See docs/CONTRACTS.md.
embeddings = [
  "langchain-huggingface>=1.0",
  "langchain-chroma>=0.2",
  "sentence-transformers>=3.4",
]
ocr = [
  "pytesseract>=0.3.13",
]
tables = [
  "camelot-py>=0.11",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-cov>=6",
  "pytest-asyncio>=0.24",
  "respx>=0.23",
  "schemathesis>=4.32",
  "black>=25.1",
  "ruff>=0.9",
  "reportlab>=4.2",
  "mypy>=1.15",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "shared",
  "app",
  "collectors",
  "collectors.manual",
  "extraction",
  "extraction.tier1",
  "extraction.llm",
  "extraction.llm.manual",
  "validation",
  "db",
  "services",
  "integration",
]

[tool.setuptools.package-data]
# The seed alias table lives next to the module that loads it.
"db" = ["seed_data/*.json"]
# The prompts are data files: `load_prompt()` resolves them next to the
# module, so they have to survive a wheel build.
"extraction.llm" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "flaky_network: test makes live network calls and may fail when external sites are unreachable or return 4xx",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# UP042: the frozen schemas use `class X(str, Enum)` on purpose. Pydantic
# serialises by value either way and the explicit form keeps the members
# comparable to plain strings in every Python 3.11+ version.
ignore = ["B008", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
