# PartPilot with Docker Compose.
#
#   docker compose up --build              # the API on :8000 and the web on :5173
#   docker compose --profile mock up mock-api   # the fixture backed mock on :8001
#   docker compose down                    # stop everything
#
# No secret is in the image. The keys come from the `.env` file of the server.
# The `.env` file is not in Git. Copy `.env.example` to `.env` and fill it in.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: partpilot-searxng
    ports:
      - "${PARTPILOT_DOCKER_SEARXNG_PORT:-8088}:8080"
    volumes:
      - ./docker/searxng-config:/etc/searxng:rw
    environment:
      BASE_URL: http://localhost:8080/
      INSTANCE_NAME: PartPilot Search
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 3s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: partpilot-backend:local
    container_name: partpilot-api
    ports:
      - "${PARTPILOT_DOCKER_API_PORT:-8002}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PARTPILOT_DATA_DIR: /app/data
      PARTPILOT_DB_PATH: /app/data/partpilot.db
      PARTPILOT_API_HOST: 0.0.0.0
      PARTPILOT_API_PORT: 8000
      PARTPILOT_SEARXNG_URL: http://searxng:8080
      PARTPILOT_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5175,http://127.0.0.1:5175,http://localhost:80,http://localhost,http://web
      PARTPILOT_LLM_BASE_URL: ${PARTPILOT_DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    depends_on:
      searxng:
        condition: service_healthy
    volumes:
      # The raw PDFs, the cached API responses and the SQLite database.
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: partpilot-frontend:local
    container_name: partpilot-web
    ports:
      - "${PARTPILOT_DOCKER_WEB_PORT:-5175}:80"
    depends_on:
      - api
      - searxng
    restart: unless-stopped

  # The fixture backed mock. It serves the recorded API responses, so the
  # frontend can be built without a key and without a network.
  #   docker compose --profile mock up mock-api
  mock-api:
    profiles: ["mock"]
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: partpilot-backend:local
    container_name: partpilot-mock-api
    command:
      - uvicorn
      - tools.mock_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data
    restart: "no"
